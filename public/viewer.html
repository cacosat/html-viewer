<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documento · Visor HTML</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>(function(){try{var s=localStorage,p=s.getItem('hv-theme')||'system',r=document.documentElement;var d=p==='dark'||(p!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=d?'dark':'light';if(s.getItem('hv-left')==='closed')r.dataset.left='closed';var rp=s.getItem('hv-right');if(rp==='closed'||(rp===null&&innerWidth<1440))r.dataset.right='closed';}catch(e){}})();</script>
  <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
</head>
<body class="app-body">
  <div class="shell has-panel" id="shell">
    <nav class="ribbon" id="ribbon" aria-label="Navegación"></nav>
    <aside class="explorer" id="explorer" aria-label="Explorador"></aside>

    <main class="workspace">
      <header class="view-header">
        <div class="vh-left">
          <button type="button" class="ui-btn ui-btn-ghost ui-btn-icon vh-menu" data-shell="menu" aria-label="Abrir explorador"><i data-icon="menu"></i></button>
          <nav class="crumbs-nav" aria-label="Ruta">
            <a class="crumb cq-hide-sm" id="crumb-scope" href="/library">Mis archivos</a>
            <span class="crumb-sep cq-hide-sm">/</span>
            <input id="title" class="title-input" aria-label="Título del documento" placeholder="Sin título" spellcheck="false" autocomplete="off">
          </nav>
          <span class="save-state" id="save-state" role="status" hidden><span class="save-text cq-hide-lg"></span></span>
        </div>
        <div class="vh-center">
          <div class="ui-segmented" id="modes" role="tablist" aria-label="Modo">
            <button type="button" class="ui-segment" role="tab" data-mode="view" aria-selected="true" title="Vista: el documento tal cual, con sus scripts"><i data-icon="eye" data-size="14"></i><span class="seg-label cq-hide-sm">Vista</span></button>
            <button type="button" class="ui-segment" role="tab" data-mode="edit" aria-selected="false" title="Editar: texto, formato y bloques"><i data-icon="pencil" data-size="14"></i><span class="seg-label cq-hide-sm">Editar</span></button>
            <button type="button" class="ui-segment" role="tab" data-mode="code" aria-selected="false" title="Código: el HTML fuente"><i data-icon="code" data-size="14"></i><span class="seg-label cq-hide-sm">Código</span></button>
          </div>
        </div>
        <div class="vh-right">
          <button type="button" class="ui-btn ui-btn-ghost cq-square-md" id="discard" title="Descartar los cambios sin guardar" hidden><i data-icon="rotate-ccw"></i><span class="cq-hide-md">Descartar</span></button>
          <button type="button" class="ui-btn ui-btn-ghost ui-btn-icon hide-xs" id="present" aria-label="Presentar" title="Presentar en pantalla completa"><i data-icon="presentation"></i></button>
          <button type="button" class="ui-btn cq-square-md" id="share" title="Compartir" aria-label="Compartir"><i data-icon="share"></i><span class="cq-hide-md">Compartir</span></button>
          <button type="button" class="ui-btn ui-btn-primary" id="save" disabled>Guardar</button>
          <button type="button" class="ui-btn ui-btn-ghost" id="toggle-panel" aria-label="Comentarios y detalles" aria-controls="panel"><i data-icon="panel-right"></i><span class="ui-badge ui-badge-count" id="panel-count" hidden></span></button>
        </div>
      </header>

      <div class="doc-area" id="docArea">
        <!-- Barra de formato (solo en Editar). Vive fuera del iframe: nada de esto se guarda. -->
        <div class="format-bar" id="formatBar" role="toolbar" aria-label="Formato de texto" hidden></div>
        <div class="stage-wrap">
          <div class="stage" id="viewStage">
            <iframe class="sheet" id="viewFrame" title="Documento" sandbox="allow-scripts allow-forms allow-popups allow-modals allow-downloads"></iframe>
          </div>
          <div class="stage" id="editStage" hidden>
            <iframe class="sheet" id="editFrame" title="Documento en edición" sandbox="allow-same-origin"></iframe>
          </div>
          <div class="code-pane" id="codePane" hidden>
            <textarea id="code" spellcheck="false" aria-label="Código HTML"></textarea>
          </div>
          <!-- Editor de bloques: contorno + mini-barra del bloque activo (overlays del padre). -->
          <div class="edit-overlays" id="editOverlays" hidden>
            <div class="block-outline" id="blockOutline" hidden></div>
            <div class="block-bar" id="blockBar" role="toolbar" aria-label="Bloque seleccionado" hidden></div>
          </div>
        </div>
        <div class="edit-status" id="editStatus" hidden></div>
      </div>
    </main>

    <aside class="panel" id="panel" aria-label="Panel del documento">
      <div class="panel-inner">
        <div class="panel-tabs ui-tabs" role="tablist" aria-label="Panel">
          <button type="button" class="ui-tab" role="tab" id="tab-comments" data-ptab="comments" aria-controls="ptab-comments" aria-selected="true">Comentarios <span class="ui-badge ui-badge-count" id="comments-count" hidden></span></button>
          <button type="button" class="ui-tab" role="tab" id="tab-details" data-ptab="details" aria-controls="ptab-details" aria-selected="false">Detalles</button>
          <span class="spacer"></span>
          <button type="button" class="ui-btn ui-btn-ghost ui-btn-sm ui-btn-icon panel-close" id="panel-close" aria-label="Cerrar panel" title="Cerrar panel"><i data-icon="x"></i></button>
        </div>
        <section class="panel-body" id="ptab-comments" role="tabpanel" aria-labelledby="tab-comments">
          <div class="comments-list" id="comments-list"></div>
          <form class="composer" id="comments-form">
            <label class="visually-hidden" for="comment-body">Nuevo comentario</label>
            <textarea class="ui-input" id="comment-body" placeholder="Escribe un comentario" rows="3"></textarea>
            <div class="composer-row">
              <span class="caption subtle" id="composer-hint"></span>
              <button type="submit" class="ui-btn ui-btn-sm">Comentar</button>
            </div>
          </form>
        </section>
        <section class="panel-body" id="ptab-details" role="tabpanel" aria-labelledby="tab-details" hidden>
          <div class="details" id="details"></div>
        </section>
      </div>
    </aside>

    <div class="drawer-scrim" data-shell="scrim"></div>
  </div>
  <script type="module" src="/viewer.js"></script>
</body>
</html>
